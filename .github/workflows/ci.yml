name: Build and Test

on:
 push:
  branches: [main]
 pull_request:
  branches: [main]

jobs:
 build-and-test:
  runs-on: ubuntu-latest
  steps:
   - name: Checkout repository
     uses: actions/checkout@v7

   - name: Setup Node.js
     uses: actions/setup-node@v7
     with:
      node-version: '22'
      cache: 'npm'

   - name: Install dependencies
     run: npm ci

   - name: Run ESLint
     run: npm run lint

   - name: Run tests
     run: npm test

   - name: Build Docker image
     run: docker build -t visit-counter .

   - name: Scan Docker image with Trivy
     uses: aquasecurity/trivy-action@v0.36.0
     with:
      scan-type: 'image'
      image-ref: 'visit-counter:latest'
      format: 'table'
      severity: 'HIGH,CRITICAL'
      exit-code: '1'
